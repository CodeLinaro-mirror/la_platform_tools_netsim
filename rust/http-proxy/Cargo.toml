[package]
name = "http-proxy"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["staticlib", "lib"]
path = "src/lib.rs"
doctest = false

[dependencies]
base64 = "0.22.0"
bytes = { version = ">=1.4.0" }
etherparse = { version = "0.16" }
httparse = "1.8.0"
libslirp-rs = { path = "../libslirp-rs" }
log = "0.4.17"
regex = "1.6.0"
tokio = { version = "1.32.0", features = [
  "fs",
  "io-util",
  "macros",
  "net",
  "rt-multi-thread",
  "sync",
] }

[dev-dependencies]
capture = { path = "../capture" }

[[bench]]
name = "dns_benchmark"
harness = false
