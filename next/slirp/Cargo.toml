[package]
name = "slirp"
version = "0.1.0"
edition = "2024"

[dependencies]
bytes = "1"
log = "0.4"
netsim-packets = { path = "../packets" }
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
zerocopy = { version = "0.8.26", features = ["derive"] }

[dev-dependencies]
base64 = "0.22.1"
env_logger = "0.11.3"
log = "0.4.21"
tokio = { version = "1.38.0", features = ["full"] }
test-case = "3.3.1"
pcap = "1.1.0"
libc = "0.2.153"
tempfile = "3.10"
