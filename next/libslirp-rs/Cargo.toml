[package]
name = "libslirp-rs"
version = "0.1.0"
edition = "2021"
##build = "build_cargo.rs"

[lib]
path = "src/lib.rs"
crate-type = ["staticlib", "lib"]
doctest = false

[dependencies]
bytes = { version = "1.4.0" }
libc = "0.2"
tokio = { version = "1.32.0", features = ["net", "rt-multi-thread"] }
tracing = "0.1"
winapi = { version = "0.3", features = ["winsock2"] }

[build-dependencies]
##bindgen = "0.69.4"
