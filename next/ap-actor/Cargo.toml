[package]
name = "ap-actor"
version = "0.1.0"
edition = "2021"

[dependencies]
cxx = "1.0"
thiserror = "1.0"
log = "0.4"
netsim-packets = { path = "../packets" }

bytes = "1"
futures = "0.3"
tokio = { version = "1", features = ["full"] }
netsim-proto = { path = "../proto" }
actor-framework = { path = "../actor-framework" }
aes = "0.8.4"
async-trait = "0.1"
ccm = "0.5.0"
serde = { version = "1.0", features = ["derive"] }
zerocopy = "0.7"

[build-dependencies]
cxx-build = "1.0"

[dev-dependencies]
tokio-stream = "0.1"

[dependencies.mockall]
version = "0.13"
optional = true

[features]
testing = ["dep:mockall"]
