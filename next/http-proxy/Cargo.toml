[package]
name = "http-proxy"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["staticlib", "lib"]
path = "src/lib.rs"
doctest = false

[dependencies]
base64 = "0.22.0"
bytes = { version = ">=1.4.0" }
etherparse = { version = "0.16" }
percent-encoding = "2.3"
slirp = { path = "../slirp" }
thiserror = "1.0"
tokio = { version = "1.32.0", features = [
  "fs",
  "io-util",
  "macros",
  "net",
  "rt-multi-thread",
  "sync",
] }
tracing = "0.1"
url = "2.5"

[dev-dependencies]
# capture = { path = "../capture" }

[[bench]]
name = "dns_benchmark"
harness = false
