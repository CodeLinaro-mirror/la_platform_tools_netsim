[package]
name = "netsim-rest-api"
version = "0.1.0"
edition = "2024"

[dependencies]
ap-actor = { path = "../ap-actor" }
device-actor = { path = "../device-actor" }
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
link-api = { path = "../link-api" }
netsim-model = { path = "../model" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = [
  "io-util",
  "macros",
  "net",
  "rt",
  "sync",
  "time",
] }
tracing = "0.1"

[dev-dependencies]
actor-framework = { path = "../actor-framework" }
async-trait = "0.1"
