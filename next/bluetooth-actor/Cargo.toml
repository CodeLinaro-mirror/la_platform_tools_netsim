[package]
name = "bluetooth"
version = "0.1.0"
edition = "2021"

[lib]
path = "src/lib.rs"
crate-type = ["staticlib", "lib"]

[dependencies]
actor-framework = { path = "../actor-framework" }
async-trait = "0.1.68"
bytes = "1.4.0"
client = { path = "../client" }
device-api = { path = "../device-api" }
env_logger = { version = "0.10.0", default-features = false }
futures = "0.3.31"
hex = "0.4.3"
log = "0.4.17"
netsim-common = { path = "../common" }
netsim-model = { path = "../model" }
protobuf = "3.6.0"
rand = "0.8.5"
rootcanal = { path = "../rootcanal" }
serde = { version = "1.0", features = ["derive"] }
thiserror = "1.0"
tokio = { version = "1.32.0", default-features = false, features = [
  "rt",
  "time",
  "sync",
  "macros",
] }
tokio-stream = "0.1.17"
zerocopy = "0.8.25"

[features]
default = []
test-utils = []

[dev-dependencies]
rootcanal = { path = "../rootcanal" }
netsim-testing = { path = "../testing", features = ["testing"] }
