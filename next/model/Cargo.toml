[package]
name = "netsim-model"
version = "0.1.0"
edition = "2021"
authors = ["The Android Open Source Project"]

[features]
testing = ["dep:mockall"]

[dependencies]
tokio = { version = "1.32.0", default-features = false, features = [
  "rt",
  "time",
  "sync",
  "macros",
] }
log = "0.4"
async-trait = "0.1.73"
serde = { version = "1.0", features = ["derive"] }
thiserror = "1.0"
tracing = "0.1.40"
tracing-attributes = "0.1.27"
anyhow = "1.0"
bytes = { version = "1.10.1", features = ["serde"] }
futures = "0.3"
packet-stream = { path = "../packet-stream" }
netsim-types = { path = "../types" }
tokio-stream = "0.1.17"
mockall = { version = "0.14.0", optional = true }
