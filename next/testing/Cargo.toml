[package]
name = "netsim-testing"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
async-trait = "0.1"
bytes = "1"
clap = { version = "4.1.8", features = ["derive", "env"] }
env_logger = "0.10.0"
futures = "0.3"
gherkin = "0.14"
log = "0.4"
netsim-common = { path = "../common" }
proc-macro2 = "1"
quote = "1"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
socket2 = "0.5"
syn = { version = "2", features = ["full"] }
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
tokio-util = "0.7"
which = "4.4"
zerocopy = "0.7"

[features]
testing = []
