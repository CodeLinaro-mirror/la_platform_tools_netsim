[package]
name = "netsim-packets"
version = "0.1.0"
edition = "2024"

[lib]
path = "src/lib.rs"
crate-type = ["staticlib", "lib"]
doctest = false

[dependencies]
hex = "0.4.3"
num-derive = "0.4"
num-traits = "0.2"
pdl-runtime = "0.4.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.143"
zerocopy = { version = "0.8", features = ["derive"] }
