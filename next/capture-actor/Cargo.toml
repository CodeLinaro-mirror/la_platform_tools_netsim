[package]
name = "capture-actor"
version = "0.1.0"
edition = "2021"

[dependencies]
actor-framework = { path = "../actor-framework" }
futures = "0.3"
capture-api = { path = "../capture-api" }
netsim-model = { path = "../model" }
tokio = { version = "1.0", features = ["full"] }
async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }
bytes = "1.5"
zerocopy = { version = "0.8", features = ["derive"] }
byteorder = "1.4"
anyhow = "1.0"
thiserror = "1.0"
log = "0.4"
