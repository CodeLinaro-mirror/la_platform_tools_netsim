[package]
name = "packet-stream"
version = "0.1.0"
edition = "2021"
description = "Simplified cross-platform packet streaming framework - core library"
repository = "https://github.com/schilit/packetstream"
license = "MIT"
keywords = ["ipc", "networking", "packets", "cross-platform", "performance"]
categories = ["network-programming", "api-bindings"]

[dependencies]
tokio = { version = "1.0", features = ["full"] }
bytes = "1.0"
serde = { version = "1.0", features = ["derive"] }
rand = "0.8"
async-trait = "0.1"

tokio-stream = { version = "0.1", features = ["net"] }
serde_json = "1.0.143"

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["namedpipeapi", "winbase"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
nix = { version = "0.27", features = ["fs", "socket"] }
rustutils = { git = "https://github.com/google/rustutils", branch = "main" }

[dev-dependencies]
tokio-test = "0.4.3"
hmac = "0.12.1"
sha2 = "0.10.8"

[workspace]