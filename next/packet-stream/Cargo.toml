[package]
name = "packet-stream"
version = "0.1.0"
edition = "2021"
description = "Simplified cross-platform packet streaming framework - core library"
repository = "https://github.com/schilit/packetstream"
license = "MIT"
keywords = ["ipc", "networking", "packets", "cross-platform", "performance"]
categories = ["network-programming", "api-bindings"]

[dependencies]
async-trait = "0.1"
bytes = "1.0"
futures = "0.3"
netsim-types = { path = "../types" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.143"
thiserror = "1.0"
tokio = { version = "1.0", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }

[dev-dependencies]
tokio-test = "0.4.3"
hmac = "0.12.1"
sha2 = "0.10.8"
