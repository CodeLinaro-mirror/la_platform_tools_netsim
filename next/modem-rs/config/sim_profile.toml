# SIM Card Profile

# ICCID of the SIM card
iccid = "89860318640220133897"

# International Mobile Subscriber Identity (IMSI)
imsi = "311740123456789"

# Phone number stored on the SIM
msisdn = "15552143657"

[pin_profile]
# Initial state can be: "Unknown", "EnabledNotVerified", "EnabledBlocked"
state = "Unknown"
pin1 = "1234"
puk1 = "12345678"
pin2 = "1234"
puk2 = "12345678"

[facility_locks]
# Lock status can be "Enabled" or "Disabled"
sim_lock = "Disabled" # SC
fixed_dialing = "Disabled" # FD

# SIM Application Toolkit (STK) Menu
[stk]
[stk.setup_menu]
text = "D0388103012500820281820509804E2D56FD79FB52A88F10508000530049004D5FEB6377786E8BA48F104E80005500530049004D53614FE1606F"

    [[stk.setup_menu.items]]
    id = "1"
    text = "D02D8103012400820281828F0A018053E34EE48BBE7F6E8F0A02804E1A52A14ECB7ECD8F0A0380724867434FE1606F"
    # Further nested items can be defined here

# SIM File System (simplified)
# This section defines responses to SIM I/O commands (AT+CRSM)
[sim_io]
[sim_io.files]
# EF_ICCID (2FE2)
"2FE2" = [
    { cmd = "C0", p1 = "0", p2 = "0", p3 = "F", data = "", response = "144,0,62178202412183022FE28A01058B032F06038002000A880110" },
    { cmd = "B0", p1 = "0", p2 = "0", p3 = "A", data = "", response = "144,0,98683081462002318379" },
]
# EF_IMSI (6F07) under USIM ADF
"6F07" = [
    # This is a special case, not a real SIMIO response, but holds the data
    { is_imsi = true, value = "311740123456789" }
]
# EF_MSISDN (6F40)
"6F40" = [
    { cmd = "C0", p1 = "0", p2 = "0", p3 = "F", data = "", response = "144,0,621982054221001C0283026F408A01058B036F0605800200388800" },
