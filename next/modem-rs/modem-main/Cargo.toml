[package]
name = "modem-main"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "modem_simulator"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5.4", features = ["derive"] }
daemonize = "0.5.0"
env_logger = "0.10"
log = "0.4"
modem-rs = { path = ".." }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
url = "2.5.0"
