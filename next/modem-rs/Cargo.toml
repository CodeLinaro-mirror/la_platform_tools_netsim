[package]
name = "modem-rs"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["staticlib", "lib"]
doctest = false

[dependencies]
bytes = "1"
hex = "0.4.3"
log = "0.4"
modem-rs-derive = { path = "../modem-rs-derive" }
netsim-model = { path = "../model" }
nom = "7"
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"

[dev-dependencies]
modem-rs = { path = ".", features = ["test-utils"] }
log = "0.4"
env_logger = "0.10"
once_cell = "1.19"

[features]
test-utils = []
