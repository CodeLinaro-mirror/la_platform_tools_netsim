[package]
name = "modem-rs"
version = "0.1.0"
edition = "2024"
autotests = false

[[test]]
name = "modem_tests"
path = "tests/mod.rs"

[lib]
crate-type = ["staticlib", "lib"]
doctest = false

[dependencies]
bytes = "1"
chrono = { version = "0.4.19", default-features = false, features = ["now"] }
hex = "0.4.3"
modem-rs-derive = { path = "../modem-rs-derive" }
netsim-model = { path = "../model" }
nom = "7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.28.2", features = ["full", "tracing"] }
toml = "0.8"
tracing = "0.1"

[dev-dependencies]
modem-rs = { path = ".", features = ["test-utils"] }
tracing = "0.1"
tracing-subscriber = "0.3.23"
once_cell = "1.19"
tempfile = "3"

[features]
test-utils = []
