[package]
name = "actor-framework"
version = "0.1.0"
edition = "2024"

[dependencies]
async-trait = "0.1.89"
bytes = "1.9.0"
futures = "0.3"
paste = "1.0.15"
thiserror = "2.0.17"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
tokio-util = { version = "0.7", features = ["time"] }
tracing = "0.1"

[dev-dependencies]
mockall = "0.13"

[features]
testing = []
